services:
  # PHOENIX FastAPI Backend Service
  - type: web
    name: phoenix-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: phoenix-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-70b-versatile
      - key: GITHUB_TOKEN
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: "[\"*\"]"

  # PHOENIX React + Vite Frontend Web Dashboard
  - type: web
    name: phoenix-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: phoenix-backend
          property: url

databases:
  # Managed PostgreSQL Database
  - name: phoenix-postgres
    databaseName: phoenix_db
    user: phoenix
    plan: free
